<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>听本 · 提交合成文字</title>
<style>body{font:15px/1.7 system-ui,sans-serif;max-width:680px;margin:24px auto;padding:0 16px;color:#222}
h2{margin-bottom:4px}p{margin:8px 0}input,textarea,button{font:inherit;box-sizing:border-box}
input,textarea{width:100%;padding:8px;border:1px solid #bbb;border-radius:8px}
textarea{height:92px}button{padding:10px 18px;border:0;border-radius:8px;background:#2f6fed;color:#fff;cursor:pointer}
button:disabled{background:#999}#s{white-space:pre-wrap;background:#f5f6f8;padding:10px;border-radius:8px;min-height:24px}
audio{width:100%;margin-top:10px}.note{font-size:12px;color:#666}a{color:#2f6fed}</style></head>
<body>
<p class="note"><a href="index.html">← 听本首页</a> · 这一页才提交文字</p>
<h2>听本 · 提交合成文字</h2>
<p>音色用的是手机上调音台当前预设，这里只填文字。拿到的是手机本地压缩好的音频（M4A，失败时回退 WAV）。</p>
<p>仓库 <input id="o" value="zjh1934"> / <input id="r" value="tingben-relay"></p>
<p>Token（只发往 api.github.com）<input id="k" type="password" placeholder="github_pat_..."></p>
<p>要念的文字<textarea id="t">你好，这是一段跨网测试。</textarea></p>
<p><button id="b" onclick="go()">提交并等待音频</button> &nbsp; <a id="dl" download="tingben.m4a" style="display:none">下载音频</a></p>
<div id="s">还没提交。</div>
<audio id="a" controls></audio>
<p class="note">文字经过私有 GitHub 仓库，手机合成完立刻删请求文件；Token 只给这一个仓库。异步，几秒到十几秒。
手机要开着「设置 → 跨网中继」；远端请求优先于整本制作，书会在当前音频小块结束后让路。</p>
<script>
const $=id=>document.getElementById(id);
const API=()=> 'https://api.github.com/repos/'+$('o').value.trim()+'/'+$('r').value.trim();
const H=()=>({'Authorization':'Bearer '+$('k').value.trim(),'Accept':'application/vnd.github+json',
 'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'});
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const un64=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
async function req(m,p,body,accept){const hh=H();if(accept)hh.Accept=accept;const r=await fetch(API()+p,{method:m,headers:hh,body:body?JSON.stringify(body):undefined});
 const ct=r.headers.get('Content-Type')||'';const d=ct.includes('json')?await r.json():await r.arrayBuffer();
 if(!r.ok)throw new Error((d.message||('HTTP '+r.status))+'');return {status:r.status,data:d};}
function uuid(){return [...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function go(){
 const b=$('b');b.disabled=true;const txt=$('t').value;if(!txt.trim()){$('s').textContent='先填文字';b.disabled=false;return;}
 if(!$('k').value.trim()){$('s').textContent='先填 Token';b.disabled=false;return;}
 const id=uuid(),qp='queue/'+id+'.json';
 try{
  $('s').textContent='提交中…（'+txt.length+' 字，正文不回显）';
  await req('PUT','/contents/'+qp,{message:'relay: 提交合成请求',content:b64(JSON.stringify({v:1,text:txt})),branch:'main'});
  $('s').textContent='已提交，等手机来取…（手机要开着「设置 → 跨网中继」）';
  const deadline=Date.now()+600000;
  while(Date.now()<deadline){
   await new Promise(r=>setTimeout(r,3000));
   let st;try{st=await req('GET','/contents/status/'+id+'.json?ref=main')}catch(e){continue}
   if(!st.data||!st.data.content)continue;
   const j=JSON.parse(un64(st.data.content));
   if(j.state==='failed')throw new Error('手机侧合成失败：'+(j.reason||'无原因'));
   // R401/R405 · 手机正在处理另一批合成（远端整批优先，书在段边界让路）：请求留着，不是失败。
   if(j.state==='busy'){$('s').textContent='手机正处理另一批合成（'+(j.reason||'稍候')+'），请求留着不丢，忙完自动补…';continue;}
   if(j.state!=='done')continue;
   $('s').textContent='手机合成并压缩好了，正在取回…';
   let raw;
   try{const a=await req('GET','/contents/'+j.audio+'?ref=main');
       if(!a.data.content)throw new Error('文件超过 1MB，改走 blob');
       raw=Uint8Array.from(atob(a.data.content.replace(/\s/g,'')),c=>c.charCodeAt(0));
   }catch(e){
       const a=await req('GET','/git/blobs/'+(j.sha||''),null,'application/vnd.github.raw');
       raw=new Uint8Array(a.data);
   }
   const blob=new Blob([raw],{type:j.format==='wav'?'audio/wav':'audio/mp4'});
   const u=URL.createObjectURL(blob);$('a').src=u;$('a').play();
   const dl=$('dl');dl.href=u;dl.style.display='inline';dl.download='tingben.'+(j.format||'m4a');
   $('s').textContent='好了 · '+raw.length+' 字节 · 格式='+(j.format||'m4a');
   b.disabled=false;return;
  }
  throw new Error('等超时了：手机没开中继或没连上 api.github.com');
 }catch(e){$('s').textContent='没成：'+e.message;b.disabled=false;}
}
</script></body></html>

name: 听本 · 构建 APK

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", "logs/**", "build-report/**"]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  # R36：旧组里两个 queued run 互相等 runner，换成新组让本次构建独立调度
  group: tingben-build-r36
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: 结构自检
        run: python3 scripts/check_structure.py

      - name: R66 语言模型退场验证（UI 零残留 / 三列四步 / 恒直接朗读 / 反向注入 / 守恒）
        run: python3 scripts/r66_verify.py

      - name: R67 P1a 死代码清理验证（零残留 / 旧数据兼容 / 守恒 / 反向注入）
        run: python3 scripts/r67_verify.py

      - name: R68 P1b 单一路径重构验证（旧文件不存在 / 零残留 / 守恒 / 反向注入）
        run: python3 scripts/r68_verify.py

      - name: R73 P2 软件设置验证（主题 / 字号 / 折叠 / 零残留 / 反向注入 / 守恒）
        run: python3 scripts/r73_verify.py

      - name: R74 P3 逐章进度验证（段章归属 / 逐章真值 / 阅读位置 / 反向注入）
        run: python3 scripts/r74_verify.py

      - name: R76 幽灵页清理验证（6 项抽屉 / Screen 9 值 / 角色 UI 零残留 / 守恒 / 反向注入）
        run: python3 scripts/r76_verify.py

      - name: R77 P1d 底层残留清理验证（删文件 / 双指纹迁移 / 零残留 / 守恒 / 反向注入）
        run: python3 scripts/r77_verify.py --selftest

      - name: R77 指纹迁移 8 组对拍
        run: python3 scripts/r77_stamp_migration.py

      - name: R78 书架首屏重排验证（空态主卡 / 整卡可点 / 上次读到 / 守恒 / 反向注入）
        run: python3 scripts/r78_verify.py --selftest

      - name: R79 P4 性能二期验证（两处门控 / 音频页 LazyColumn / 组合期 IO / 调音台锚点守恒 / 反向注入）
        run: python3 scripts/r79_verify.py --selftest

      - name: R80 我的音频页收敛验证（空态下一步 / 控制默认收起 / 零播放卡 / 守恒 / 反向注入）
        run: python3 scripts/r80_verify.py --selftest

      - name: R84 模型选择页验证（1 底座 + 3 模式 / 精确识别 / 导出日志零残留 / 守恒 / 反向注入）
        run: python3 scripts/r84_verify.py --selftest

      - name: R87 界面文案净化验证（真入口 / 旧话术零残留 / 守恒 / 反向注入）
        run: python3 scripts/r87_verify.py --selftest

      - name: R88 任务中心页收敛验证（空态下一步 / 跳转降级 / 去重 / 四项操作守恒 / 反向注入）
        run: python3 scripts/r88_verify.py --selftest

      - name: R89 调音台一级入口验证（平级入口 / 抽屉 6 项 / 导航守恒 / 反向注入）
        run: python3 scripts/r89_verify.py --selftest

      - name: R91 分段看台交互验证（格子即播停 / 旧形态零残留 / 守恒 / 反向注入）
        run: python3 scripts/r91_verify.py --selftest

      - name: R94 续跑对拍（8 组场景：界面说的 = 点继续真做的）
        run: python3 scripts/r94_resume_parity.py

      - name: R94 导入失败可恢复与续跑对拍验证（正向 / 守恒 / 反向注入）
        run: python3 scripts/r94_verify.py --selftest

      - name: R95 落盘预检对拍（8 组场景 + 合并边界 + 公式常量一致）
        run: python3 scripts/r95_space_parity.py

      - name: R95 落盘预检与阅读位置验证（正向 / 守恒 / 反向注入）
        run: python3 scripts/r95_verify.py --selftest

      - name: R96 阅读位置批量读对拍（8 组：逐本一致 / 读盘 1 次 / 共用 decode）
        run: python3 scripts/r96_read_parity.py

      - name: R96 书架长列表验证（LazyColumn / 一次异步读 / 结构 / 反向注入 / 守恒）
        run: python3 scripts/r96_verify.py --selftest
      - name: R98 调音台重写
        run: python3 scripts/r98_verify.py --selftest
      - name: R99 常驻与自定义行
        run: python3 scripts/r99_verify.py --selftest
      - name: R100 端到端链路自检（导入→分章→三模式→合成→登记→按章播放）
        run: python3 scripts/r100_chain_verify.py --selftest

      - name: R101 任务页 / 章节页二三列同步 / 采样分模式验证
        run: python3 scripts/r101_verify.py --selftest

      - name: R103 播放身份与格子同源验证（稳定 id / 按 id 比较 / 反向注入 / 守恒）
        run: python3 scripts/r103_verify.py --selftest

      - name: R104 索引原子写验证（统一落盘 / 坏索引不清空 / 报错可见 / 反向注入 / 守恒）
        run: python3 scripts/r104_verify.py --selftest

      - name: R105 试听取消与单 loader 验证（token / 门闩 / 停止入口 / 反向注入 / 守恒）
        run: python3 scripts/r105_verify.py --selftest

      - name: R40 统一提交验证（diff 对拍 / 反向注入 / 守恒）
        run: python3 scripts/r40_verify.py


      - name: R46 V1 抽屉壳验证（正向形态 / 旧壳零残留 / 反向注入 / 守恒）
        run: python3 scripts/r46_verify.py

      - name: R107 导航语义解绑验证（6 脚本解绑 / 双形态成立 / R109 镜像复跑 / 反向注入）
        run: python3 scripts/r107_verify.py --selftest

      - name: R108 F-19 停止标志验证（任务级复位 / TTS 零逐段复位 / 缓存解耦 / 反向注入）
        run: python3 scripts/r108_verify.py --selftest

      - name: R111 播放队列归属与时长口径验证（F-24 / F-22 / 反向注入）
        run: python3 scripts/r111_verify.py --selftest

      - name: R112 章节页高频进度订阅验证（F-09 / 索引不重建 / 防抖 / 反向注入）
        run: python3 scripts/r112_verify.py --selftest
      - name: R113 清单收尾验证（F-20 / F-13 / F-17 / F-23 / 反向注入）
        run: python3 scripts/r113_verify.py --selftest
      - name: R114 字号与交互收敛验证（F-08 / F-26 / F-27 / F-28 / 反向注入）
        run: python3 scripts/r114_verify.py --selftest

      - name: R116 自找缺陷四连修（F-29 / F-30 / F-31 / F-32 / 反向注入）
        run: python3 scripts/r116_verify.py



      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35 + CMake
        run: |
          set +e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1
            # 以前只装 platforms/build-tools，把 cmake;3.22.1 留给 AGP 在
            # configureCMakeDebug 阶段自己下。sdkmanager 偶发拿到损坏 zip
            # （Error on ZipFile unknown archive），Gradle 才炸，且报错看着像代码错。
            # 这里显式预装并校验可执行文件，坏了就删包重装一次。
            "$SM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "cmake;3.22.1" 2>&1 | tail -30
          fi
          CM="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          if [ ! -x "$CM" ] || ! "$CM" --version >/dev/null 2>&1; then
            echo "::warning::cmake 3.22.1 包损坏或未装，清理后重试一次"
            rm -rf "$ANDROID_HOME/cmake/3.22.1"
            "$SM" --install "cmake;3.22.1" 2>&1 | tail -30
          fi
          "$CM" --version | head -1
          ls "$ANDROID_HOME/platforms" | tail -5
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$CM"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      # R108 · JNI 桥（tingben_native.cpp / CMakeLists）由 Gradle 的 externalNativeBuild
      # 按源码增量编译，不是 build_native.sh 的产物。把它放进 key 会让「改一行 JNI」
      # 误触发上游两个引擎重编译；编译失败时守门会删掉 jniLibs，APK 降级成纯 Kotlin 包。
      # restore-keys 让新 key 未命中时回退到最近一次成功的 native 缓存，不重编上游。
      - name: 原生引擎缓存
        id: ncache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a
            app/src/main/cpp/upstream_include
          key: tingben-native-v2-${{ hashFiles('scripts/build_native.sh', 'app/src/main/cpp/llama.h', 'app/src/main/cpp/qwen.h') }}
          restore-keys: |
            tingben-native-v2-
            tingben-native-v1-

      - name: 检查缓存完整性
        id: chk
        run: |
          D=app/src/main/jniLibs/arm64-v8a
          if [ -f "$D/.verified" ] && [ -f "$D/libllama.so" ] && [ -f "$D/libqwen.so" ] && [ -f app/src/main/cpp/upstream_include/ggml.h ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 交叉编译两个推理引擎
        if: steps.chk.outputs.ok != 'true'
        continue-on-error: true
        run: |
          set +e
          chmod +x scripts/build_native.sh
          ./scripts/build_native.sh 2>&1 | tee /tmp/native.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          mkdir -p build-report
          {
            echo "# 原生引擎 run ${{ github.run_number }}"
            echo "提交 ${{ github.sha }}"
            echo
            echo '## 关键行'
            echo '```'
            grep -n -E 'error:|ERROR|::error|没编出|找不到|commit:|\.so:|缺' /tmp/native.log | tail -60
            echo '```'
            echo
            echo '## 结尾 100 行'
            echo '```'
            tail -100 /tmp/native.log
            echo '```'
          } > "build-report/native-${{ github.run_number }}.md"

      # 没通过符号差集自检就清空 jniLibs，APK 明确降级，绝不发真机 dlopen 会崩的包
      - name: 引擎守门
        run: |
          D=app/src/main/jniLibs/arm64-v8a
          if [ ! -f "$D/.verified" ] || [ ! -f "$D/libllama.so" ] || [ ! -f "$D/libqwen.so" ] || [ ! -f app/src/main/cpp/upstream_include/ggml.h ]; then
            echo "::warning::引擎未通过编译/符号自检，APK 降级为纯 Kotlin 包"
            rm -rf app/src/main/jniLibs
          else
            echo "引擎齐备，启用 native build"
            ls -lh "$D"
          fi

      - name: assembleDebug
        id: gradle
        continue-on-error: true
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 编译失败 → 日志回写
        # R103 · 原来只判 != '0'，outputs 没写进去时也会误触发；且 `git add -f logs build-report`
        # 里 build-report 不存在会让整条 add 失败，日志从没进过仓库。改用 Contents API 直写。
        if: steps.gradle.outputs.exit != '0' && steps.gradle.outputs.exit != ''
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set +e
          mkdir -p logs
          {
            echo "# 构建失败 run ${{ github.run_number }}"
            echo '## 报错行'
            echo '```'
            grep -n -E '^e: |error:|Unresolved reference|None of the following|Type mismatch|FAILURE:|What went wrong' /tmp/gradle.log | head -100
            echo '```'
            echo '## 后 200 行'
            echo '```'; tail -200 /tmp/gradle.log; echo '```'
          } > "logs/build-${{ github.run_number }}.md"
          python3 - <<'PY'
          import base64, json, os, urllib.request
          tok, repo, n = os.environ['GH_PAT'], os.environ['GITHUB_REPOSITORY'], os.environ['RUN_NO']
          path = 'logs/build-%s.md' % n
          body = json.dumps({'message': 'ci: 失败日志 run ' + n + ' [skip ci]',
                             'content': base64.b64encode(open(path, 'rb').read()).decode(),
                             'branch': 'main'}).encode()
          req = urllib.request.Request('https://api.github.com/repos/' + repo + '/contents/' + path,
              data=body, method='PUT', headers={'Authorization': 'token ' + tok,
              'Accept': 'application/vnd.github+json', 'User-Agent': 'tingben-ci'})
          try:
              print('日志回写状态', urllib.request.urlopen(req, timeout=60).status)
          except Exception as e:
              print('日志回写失败', e)
          PY
          exit 1

      - name: APK 闸门
        run: |
          set +e
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          if [ -z "$APK" ]; then echo "::error::没找到 APK"; exit 1; fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE 字节)"
          if [ "$SIZE" -gt 104857600 ]; then echo "::error::APK 超过 100MB"; exit 1; fi
          if unzip -l "$APK" | grep -qi '\.gguf'; then echo "::error::APK 里混进了模型权重"; exit 1; fi
          if [ "$(unzip -l "$APK" | grep -c 'lib/arm64-v8a/')" -eq 0 ]; then
            echo "::warning::APK 没有原生库（纯 Kotlin 降级包）"
          else
            echo "原生库:"; unzip -l "$APK" | grep 'lib/arm64-v8a/' | tail -12
          fi
          BT="$ANDROID_HOME/build-tools/35.0.0"
          [ -x "$BT/aapt" ] || BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -name '3*' | sort | tail -1)"
          echo "--- 权限 ---"
          "$BT/aapt" dump permissions "$APK" 2>/dev/null | head -20
          if "$BT/aapt" dump permissions "$APK" 2>/dev/null | grep -q 'android.permission.INTERNET'; then
            echo "::error::APK 含 INTERNET 权限"; exit 1
          fi
          "$BT/aapt" dump badging "$APK" 2>/dev/null | head -8
          mkdir -p build-report
          {
            echo "# 听本构建报告 run ${{ github.run_number }}"
            echo "提交 ${{ github.sha }} · 版本 1.1.0+${{ github.run_number }}"
            echo
            echo "APK: $SIZE 字节 ($(echo "scale=1; $SIZE/1048576" | bc) MB)"
            echo "无 INTERNET / 无 .gguf / 仅 arm64-v8a / <100MB"
          } > "build-report/build-${{ github.run_number }}.md"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: tingben-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 发布 Release（固定最新版直链）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-${{ github.run_number }}
          name: 听本 1.1.0+${{ github.run_number }}
          body: |
            本地离线把小说变成能听的音频。
            模型后导入、无 INTERNET 权限、仅 arm64-v8a、APK < 100MB。
            源码提交 ${{ github.sha }}。
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步 APK 到公开直链
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/publish_apk.py

      - name: 上传构建报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingben-report
          path: |
            build-report/
            logs/
          if-no-files-found: ignore

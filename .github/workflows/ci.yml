      - name: assembleDebug
        id: gradle
        continue-on-error: true
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 编译失败 → 日志回写
        # R103 · 原来只判 != '0'，outputs 没写进去时也会误触发；且 `git add -f logs build-report`
        # 里 build-report 不存在会让整条 add 失败，日志从没进过仓库。改用 Contents API 直写。
        if: steps.gradle.outputs.exit != '0' && steps.gradle.outputs.exit != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set +e
          mkdir -p logs
          # R145 · 编译报错行同时打成 annotation，且日志回写改用有 contents 写权限的 PAT。
          # 之前用 GITHUB_TOKEN 偶发回写失败，导致沙盒拿不到 e: 行，只能靠猜。
          grep -n -E '^e: |error:|Unresolved reference|None of the following|Type mismatch|FAILURE:|What went wrong' /tmp/gradle.log | head -60 > /tmp/err.txt || true
          while IFS= read -r ln; do echo "::error::$ln"; done < /tmp/err.txt
          {
            echo "# 构建失败 run ${{ github.run_number }}"
            echo '## 报错行'
            echo '```'
            grep -n -E '^e: |error:|Unresolved reference|None of the following|Type mismatch|FAILURE:|What went wrong' /tmp/gradle.log | head -100
            echo '```'
            echo '## 后 200 行'
            echo '```'; tail -200 /tmp/gradle.log; echo '```'
          } > "logs/build-${{ github.run_number }}.md"
          python3 - <<'PY'
          import base64, json, os, urllib.request
          tok, repo, n = os.environ['GH_PAT'], os.environ['GITHUB_REPOSITORY'], os.environ['RUN_NO']
          # R188 · 写触发这次 run 的分支。原来硬编码 main，rc/1.1.10 上编译
          # 失败却把日志推到主分支（run 146 → 2a8eeecc92），污染了 main 历史。
          # GITHUB_REF_NAME 是 Actions 默认变量：rc/x.y.z 或 main。
          branch = os.environ.get('GITHUB_REF_NAME') or 'main'
          path = 'logs/build-%s.md' % n
          body = json.dumps({'message': 'ci: 失败日志 run ' + n + ' [skip ci]',
                             'content': base64.b64encode(open(path, 'rb').read()).decode(),
                             'branch': branch}).encode()
          req = urllib.request.Request('https://api.github.com/repos/' + repo + '/contents/' + path,
              data=body, method='PUT', headers={'Authorization': 'token ' + tok,
              'Accept': 'application/vnd.github+json', 'User-Agent': 'tingben-ci'})
          try:
              print('日志回写状态', urllib.request.urlopen(req, timeout=60).status)
          except Exception as e:
              print('日志回写失败', e)
          PY
          exit 1

      - name: APK 闸门
        env:
          EXPECT_CERT: ${{ secrets.TINGBEN_SIGN_SHA256 }}
        run: |
          set +e
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          if [ -z "$APK" ]; then echo "::error::没找到 APK"; exit 1; fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE 字节)"
          if [ "$SIZE" -gt 104857600 ]; then echo "::error::APK 超过 100MB"; exit 1; fi
          if unzip -l "$APK" | grep -qi '\.gguf'; then echo "::error::APK 里混进了模型权重"; exit 1; fi
          # R142 · 软件代码是用来跑的，不是给开发者看的：文档、验证脚本、
          # 历史回执、截图、契约文本一律不许进 APK。
          if unzip -l "$APK" | grep -Eqi '\.(md|py|log|jpeg|jpg)$|/(docs|scripts|dev|contracts|真机截图)/|_verify\.py|R1[0-9][0-9]_'; then
            echo "::error::APK 里混进了开发者资料（文档/脚本/回执/截图）"; exit 1
          fi
          if [ "$(unzip -l "$APK" | grep -c 'lib/arm64-v8a/')" -eq 0 ]; then
            echo "::error::APK 没有原生库（纯 Kotlin 降级包），不能发"
            exit 1
          fi
          echo "原生库:"; unzip -l "$APK" | grep 'lib/arm64-v8a/' | tail -12
          BT="$ANDROID_HOME/build-tools/35.0.0"
          # R137 · 签名证书守门：Secret 没配齐时 Gradle 会落到默认 debug 签名，
          # 那种包装不覆盖旧版、还会丢私有目录里的模型与音频。这里逐字节比对证书。
          APKS="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1)"
          if [ -z "$APKS" ]; then
            echo "::error::找不到 apksigner，无法校验签名证书，停止发版"
            exit 1
          fi
          CERT="$("$APKS" verify --print-certs "$APK" 2>/dev/null \
            | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' \
            | tr -d ':' | tr 'A-Z' 'a-z')"
          EXPECT="$(echo "$EXPECT_CERT" | tr -d ':' | tr 'A-Z' 'a-z')"
          echo "APK 签名证书: $CERT"
          if [ -z "$CERT" ] || [ -z "$EXPECT" ] || [ "$CERT" != "$EXPECT" ]; then
            echo "::error::签名证书不匹配（未签名 / 默认 debug 签名 / 密钥被换），停止发版"
            exit 1
          fi
          [ -x "$BT/aapt" ] || BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -name '3*' | sort | tail -1)"
          echo "--- 权限 ---"
          "$BT/aapt" dump permissions "$APK" 2>/dev/null | head -20
          if "$BT/aapt" dump permissions "$APK" 2>/dev/null | grep -q 'android.permission.INTERNET'; then
            echo "::error::APK 含 INTERNET 权限"; exit 1
          fi
          "$BT/aapt" dump badging "$APK" 2>/dev/null | head -8
          mkdir -p build-report
          {
            echo "# 听本构建报告 run ${{ github.run_number }}"
            echo "提交 ${{ github.sha }} · 版本 ${{ steps.ver.outputs.v }} · run ${{ github.run_number }}"
            echo
            echo "APK: $SIZE 字节 ($(echo "scale=1; $SIZE/1048576" | bc) MB)"
            echo "无 INTERNET / 无 .gguf / 仅 arm64-v8a / <100MB"
          } > "build-report/build-${{ github.run_number }}.md"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: tingben-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 发布 Release（固定最新版直链）
        # R177 · 只允许 main 发版：验证分支用 workflow_dispatch 跑真编译时，
        # 编译通过也不许提前覆盖 v1.1.5 的 Release 与固定直链。
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: 听本 ${{ steps.ver.outputs.v }}
          body: |
            本地离线把小说变成能听的音频。
            模型后导入、无 INTERNET 权限、仅 arm64-v8a、APK < 100MB。
            版本 ${{ steps.ver.outputs.v }} · 构建 run ${{ github.run_number }} · 源码提交 ${{ github.sha }}。
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步 APK 到公开直链
        if: github.ref == 'refs/heads/main'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/publish_apk.py

      - name: 上传构建报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingben-report
          path: |
            build-report/
            logs/
          if-no-files-found: ignore

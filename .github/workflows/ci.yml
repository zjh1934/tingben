name: 听本 · 构建 APK

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", "logs/**", "build-report/**"]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  # R36：旧组里两个 queued run 互相等 runner，换成新组让本次构建独立调度
  group: tingben-build-r36
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: echo "v=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: 源码完整性（防 selftest 注入残留）
        run: python3 scripts/source_integrity.py
      - name: 源码完整性反向注入
        run: python3 scripts/source_integrity.py --selftest
      - name: R137 版本必须严格递增（防同名 tag 覆盖资产与直链）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_version_bump.py

      - name: 结构自检
        run: python3 scripts/check_structure.py

      - name: R66 语言模型退场验证（UI 零残留 / 三列四步 / 恒直接朗读 / 反向注入 / 守恒）
        run: python3 scripts/r66_verify.py

      - name: R67 P1a 死代码清理验证（零残留 / 旧数据兼容 / 守恒 / 反向注入）
        run: python3 scripts/r67_verify.py


      - name: R73 P2 软件设置验证（主题 / 字号 / 折叠 / 零残留 / 反向注入 / 守恒）
        run: python3 scripts/r73_verify.py

      - name: R74 P3 逐章进度验证（段章归属 / 逐章真值 / 阅读位置 / 反向注入）
        run: python3 scripts/r74_verify.py

      - name: R76 幽灵页清理验证（6 项抽屉 / Screen 9 值 / 角色 UI 零残留 / 守恒 / 反向注入）
        run: python3 scripts/r76_verify.py

      - name: R77 P1d 底层残留清理验证（删文件 / 双指纹迁移 / 零残留 / 守恒 / 反向注入）
        run: python3 scripts/r77_verify.py --selftest

      - name: R77 指纹迁移 8 组对拍
        run: python3 scripts/r77_stamp_migration.py

      - name: R78 书架首屏重排验证（空态主卡 / 整卡可点 / 上次读到 / 守恒 / 反向注入）
        run: python3 scripts/r78_verify.py --selftest






      - name: R89 调音台一级入口验证（平级入口 / 抽屉 6 项 / 导航守恒 / 反向注入）
        run: python3 scripts/r89_verify.py --selftest

      - name: R91 分段看台交互验证（格子即播停 / 旧形态零残留 / 守恒 / 反向注入）
        run: python3 scripts/r91_verify.py --selftest

      - name: R94 续跑对拍（8 组场景：界面说的 = 点继续真做的）
        run: python3 scripts/r94_resume_parity.py

      - name: R94 导入失败可恢复与续跑对拍验证（正向 / 守恒 / 反向注入）
        run: python3 scripts/r94_verify.py --selftest

      - name: R95 落盘预检对拍（8 组场景 + 合并边界 + 公式常量一致）
        run: python3 scripts/r95_space_parity.py

      - name: R95 落盘预检与阅读位置验证（正向 / 守恒 / 反向注入）
        run: python3 scripts/r95_verify.py --selftest

      - name: R96 阅读位置批量读对拍（8 组：逐本一致 / 读盘 1 次 / 共用 decode）
        run: python3 scripts/r96_read_parity.py

      - name: R96 书架长列表验证（LazyColumn / 一次异步读 / 结构 / 反向注入 / 守恒）
        run: python3 scripts/r96_verify.py --selftest
      - name: R98 调音台重写
        run: python3 scripts/r98_verify.py --selftest
      - name: R99 常驻与自定义行
        run: python3 scripts/r99_verify.py --selftest
      - name: R100 端到端链路自检（导入→分章→三模式→合成→登记→按章播放）
        run: python3 scripts/r100_chain_verify.py --selftest




      - name: R105 试听取消与单 loader 验证（token / 门闩 / 停止入口 / 反向注入 / 守恒）
        run: python3 scripts/r105_verify.py --selftest

      - name: R40 统一提交验证（diff 对拍 / 反向注入 / 守恒）
        run: python3 scripts/r40_verify.py


      - name: R46 V1 抽屉壳验证（正向形态 / 旧壳零残留 / 反向注入 / 守恒）
        run: python3 scripts/r46_verify.py

      - name: R107 导航语义解绑验证（6 脚本解绑 / 双形态成立 / R109 镜像复跑 / 反向注入）
        run: python3 scripts/r107_verify.py --selftest

      - name: R108 F-19 停止标志验证（任务级复位 / TTS 零逐段复位 / 缓存解耦 / 反向注入）
        run: python3 scripts/r108_verify.py --selftest


      - name: R112 章节页高频进度订阅验证（F-09 / 索引不重建 / 防抖 / 反向注入）
        run: python3 scripts/r112_verify.py --selftest
      - name: R113 清单收尾验证（F-20 / F-13 / F-17 / F-23 / 反向注入）

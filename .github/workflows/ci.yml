      - name: R114 字号与交互收敛验证（F-08 / F-26 / F-27 / F-28 / 反向注入）
        run: python3 scripts/r114_verify.py --selftest

      - name: R116 自找缺陷四连修（F-29 / F-30 / F-31 / F-32 / 反向注入）
        run: python3 scripts/r116_verify.py
      - name: 退役页统一守门（批次 E · 17 个重复壳脚本收敛为 1 项，带反向注入）
        run: python3 scripts/retired_pages.py --selftest
      - name: R127 制作任务链自动续跑验证（停止态回写 / 切章规则守卫 / 失败态不重试 / 反向注入）
        run: python3 scripts/r127_verify.py --selftest
      - name: R128 分段看台状态重建验证（计划段唯一骨架 / 灰格不消失 / 60 段硬砍零残留 / 反向注入）

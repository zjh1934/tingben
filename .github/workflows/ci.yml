      - name: R155 界面讨论轮验证（展开惰性化 / 弹层安全区与空白退出 / 阅读可复制 / 反向注入）
        run: python3 scripts/r155_verify.py --selftest
      - name: R156 成品导出地基验证（SAF 目录树 / 持久化授权 / 私有目录结论 / 反向注入）
        run: python3 scripts/r156_verify.py --selftest
      - name: R157 第二份真机日志实证验证（站点噪声 / 跳过段日志 / 报错版本 / 导出分目录 / 反向注入）
        run: python3 scripts/r157_verify.py --selftest
      - name: R158 硬约束清理 / 分段格子居中 / 后台权限引导验证（反向注入）
        run: python3 scripts/r158_verify.py --selftest
      - name: AOCI 认知索引协议级治理（格式 / 覆盖 / 漂移 / 反向注入）
        run: python3 scripts/aoci_check.py --selftest
      - name: R161 前台服务生命周期（6h 超时 / 退出原因 / 悬浮进度 / 反向注入）
        run: python3 scripts/r161_verify.py --selftest
      - name: R163 目录页三列并一列（单列 / 章级能力守恒 / 小片惰性居中 / 反向注入）
        run: python3 scripts/r163_verify.py --selftest



      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35 + CMake
        run: |
          set +e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1
            # 以前只装 platforms/build-tools，把 cmake;3.22.1 留给 AGP 在
            # configureCMakeDebug 阶段自己下。sdkmanager 偶发拿到损坏 zip
            # （Error on ZipFile unknown archive），Gradle 才炸，且报错看着像代码错。
            # 这里显式预装并校验可执行文件，坏了就删包重装一次。
            "$SM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "cmake;3.22.1" 2>&1 | tail -30
          fi
          CM="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          if [ ! -x "$CM" ] || ! "$CM" --version >/dev/null 2>&1; then
            echo "::warning::cmake 3.22.1 包损坏或未装，清理后重试一次"
            rm -rf "$ANDROID_HOME/cmake/3.22.1"
            "$SM" --install "cmake;3.22.1" 2>&1 | tail -30
          fi
          "$CM" --version | head -1
          ls "$ANDROID_HOME/platforms" | tail -5
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$CM"

      - name: R137 注入签名密钥（来自 Actions Secret，仓库内零明文）
        env:
          KS_B64: ${{ secrets.TINGBEN_KEYSTORE_B64 }}
          KS_STORE: ${{ secrets.TINGBEN_STORE_PASSWORD }}
          KS_KEY: ${{ secrets.TINGBEN_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.TINGBEN_KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_STORE" ] || [ -z "$KS_KEY" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::签名 Secret 没配齐，停止构建（否则会产出默认 debug 签名的包，装不上）"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > keystore.jks
          test -s keystore.jks
          {
            echo "TINGBEN_STORE_PASSWORD=$KS_STORE"
            echo "TINGBEN_KEY_PASSWORD=$KS_KEY"
            echo "TINGBEN_KEY_ALIAS=$KS_ALIAS"
          } >> "$GITHUB_ENV"
          echo "签名密钥已注入（不打印内容）"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      # R108 · JNI 桥（tingben_native.cpp / CMakeLists）由 Gradle 的 externalNativeBuild
      # 按源码增量编译，不是 build_native.sh 的产物。把它放进 key 会让「改一行 JNI」
      # 误触发上游两个引擎重编译；编译失败时守门会删掉 jniLibs，APK 降级成纯 Kotlin 包。
      # restore-keys 让新 key 未命中时回退到最近一次成功的 native 缓存，不重编上游。
      - name: 原生引擎缓存
        id: ncache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a
            app/src/main/cpp/upstream_include
          key: tingben-native-v2-${{ hashFiles('scripts/build_native.sh', 'app/src/main/cpp/llama.h', 'app/src/main/cpp/qwen.h') }}
          restore-keys: |
            tingben-native-v2-
            tingben-native-v1-

      - name: 检查缓存完整性
        id: chk
        run: |
          D=app/src/main/jniLibs/arm64-v8a
          if [ -f "$D/.verified" ] && [ -f "$D/libllama.so" ] && [ -f "$D/libqwen.so" ] && [ -f app/src/main/cpp/upstream_include/ggml.h ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 交叉编译两个推理引擎
        if: steps.chk.outputs.ok != 'true'
        continue-on-error: true
        run: |
          set +e
          chmod +x scripts/build_native.sh
          ./scripts/build_native.sh 2>&1 | tee /tmp/native.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          mkdir -p build-report
          {
            echo "# 原生引擎 run ${{ github.run_number }}"
            echo "提交 ${{ github.sha }}"
            echo
            echo '## 关键行'
            echo '```'
            grep -n -E 'error:|ERROR|::error|没编出|找不到|commit:|\.so:|缺' /tmp/native.log | tail -60
            echo '```'
            echo
            echo '## 结尾 100 行'
            echo '```'
            tail -100 /tmp/native.log
            echo '```'
          } > "build-report/native-${{ github.run_number }}.md"

      # R137 · 原来只 warning + 清空 jniLibs，照样发一个不能合成音频的「降级包」。
      # 现在直接失败：宁可这轮没包，也不发装上去 dlopen 就崩的 APK。
      - name: 引擎守门（缺件直接失败，不降级发包）
        run: |
          D=app/src/main/jniLibs/arm64-v8a
          if [ ! -f "$D/.verified" ] || [ ! -f "$D/libllama.so" ] || [ ! -f "$D/libqwen.so" ] || [ ! -f app/src/main/cpp/upstream_include/ggml.h ]; then
            echo "::error::原生引擎缓存/编译未通过，停止构建；本次不发降级包"
            exit 1
          fi
          echo "引擎齐备，启用 native build"
          ls -lh "$D"

      - name: R169 真机截图与日志实证（浅色章名 / 齿轮 / 导入取消 / 噪声收敛）
